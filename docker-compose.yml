# PostgreSQL local exclusivo do EmpresTI.
#
# Isso NÃO é usado pelos testes de integração — o Testcontainers (citado no
# ADR / regras.md) sobe e derruba seu próprio Postgres descartável a cada
# `vitest run`, sem precisar deste arquivo nem de nenhuma credencial extra.
#
# Não usa a porta 5432 do projeto de MLOps. Não altera o Supabase remoto.
#
# Subir:    docker compose up -d
# Derrubar: docker compose down
# Zerar:    docker compose down -v

services:
  postgres:
    image: postgres:16
    container_name: empresti-helo-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: empresti
      POSTGRES_PASSWORD: empresti_local
      POSTGRES_DB: empresti
    ports:
      # 5433 na máquina host (evita conflito com um Postgres já rodando
      # localmente na 5432 padrão)
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empresti -d empresti"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
